
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat and Dog Person</title>

    <style>
        body {
            font-family: "Times New Roman", serif;
            background-color: white;
            color: black;
            margin: 10px;
        }

        h1 {
            font-size: 80px;
            margin-top: 0;
            margin-bottom: 55px;
        }

        img {
            display: block;
            object-fit: cover;
        }

        .cat-photo {
            width: 680px;
            height: 1020px;
        }

        .dog-photo {
            width: 706px;
            height: 460px;
        }
    </style>
</head>

<body>

    <h1>I am a Cat Person</h1>

    <img
        src="cat.png"
        alt="A cute orange kitten"
        class="cat-photo"
    >

    <br><br>

    <h1>I am a Dog Person</h1>

    <img
        src="dog.png"
        alt="A puppy digging in the sand"
        class="dog-photo"
    >

</body>
</html>
